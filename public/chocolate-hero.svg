<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chocolateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3E2723;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D4C41;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8D6E63;stop-opacity:0.4" />
    </linearGradient>
    <radialGradient id="shineGrad" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#A1887F;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6D4C41;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1200" fill="#FFF8E1"/>
  
  <!-- Shadow -->
  <ellipse cx="600" cy="1050" rx="450" ry="80" fill="#D7CCC8" opacity="0.3"/>
  
  <!-- Main chocolate bar -->
  <g transform="translate(200, 150) rotate(-5 400 450)">
    <!-- Chocolate bar base -->
    <rect x="0" y="0" width="800" height="800" rx="40" fill="url(#chocolateGrad)"/>
    
    <!-- Grid pattern for chocolate squares -->
    <g stroke="#4E342E" stroke-width="8" opacity="0.6">
      <line x1="200" y1="0" x2="200" y2="800"/>
      <line x1="400" y1="0" x2="400" y2="800"/>
      <line x1="600" y1="0" x2="600" y2="800"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="0" y1="600" x2="800" y2="600"/>
    </g>
    
    <!-- Highlights on squares -->
    <rect x="20" y="20" width="760" height="160" fill="url(#highlightGrad)" opacity="0.3"/>
    
    <!-- Shine effect -->
    <ellipse cx="300" cy="250" rx="200" ry="150" fill="url(#shineGrad)"/>
    
    <!-- Individual square highlights -->
    <g fill="#8D6E63" opacity="0.2">
      <circle cx="100" cy="100" r="30"/>
      <circle cx="300" cy="100" r="30"/>
      <circle cx="500" cy="100" r="30"/>
      <circle cx="700" cy="100" r="30"/>
      <circle cx="100" cy="300" r="30"/>
      <circle cx="300" cy="300" r="30"/>
      <circle cx="500" cy="300" r="30"/>
      <circle cx="700" cy="300" r="30"/>
    </g>
  </g>
  
  <!-- Cocoa beans decoration -->
  <g opacity="0.15">
    <ellipse cx="150" cy="200" rx="30" ry="45" fill="#3E2723" transform="rotate(-20 150 200)"/>
    <ellipse cx="1050" cy="300" rx="35" ry="50" fill="#3E2723" transform="rotate(30 1050 300)"/>
    <ellipse cx="200" cy="1000" rx="28" ry="42" fill="#3E2723" transform="rotate(-45 200 1000)"/>
    <ellipse cx="1000" cy="950" rx="32" ry="48" fill="#3E2723" transform="rotate(15 1000 950)"/>
  </g>
</svg>
